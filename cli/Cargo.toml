[package]
name = "repo-protocol"
version = "0.1.0"
description = "Deterministic repository policy checks for agent-authored changes"
categories = ["command-line-utilities", "development-tools"]
keywords = ["ci", "policy", "git", "agents"]
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"

[[bin]]
name = "repo-protocol"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5.47", features = ["derive", "env"] }
globset = "0.4.16"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
serde_yaml = "0.9.34"
sha2 = "0.10.9"
